spring.application.name=osta-backend-schedular

server.port=${SERVER_PORT:5443}
server.servlet.context-path=/
server.ssl.enabled=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

logging.level.root=INFO
logging.level.com.dipcoin.scheduler=INFO

spring.datasource.url=${OSTA_SCHEDULER_DB_URL:jdbc:h2:mem:osta_scheduler;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${OSTA_SCHEDULER_DB_USERNAME:sa}
spring.datasource.password=${OSTA_SCHEDULER_DB_PASSWORD:}
spring.datasource.driver-class-name=${OSTA_SCHEDULER_DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${OSTA_SCHEDULER_DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${OSTA_SCHEDULER_DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${OSTA_SCHEDULER_DB_CONNECTION_TIMEOUT:30000}
spring.jpa.hibernate.ddl-auto=${OSTA_SCHEDULER_JPA_DDL_AUTO:none}
spring.jpa.show-sql=${OSTA_SCHEDULER_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${OSTA_SCHEDULER_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.persistence-unit-name=schedulerJpaPersistenceUnit
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

management.server.port=${MANAGEMENT_SERVER_PORT:5100}
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=${OSTA_REDIS_HEALTH_ENABLED:false}
management.metrics.export.prometheus.enabled=true

info.app.name=${spring.application.name}
info.app.description=OSTA Backend Scheduler Service
info.app.version=@project.version@
info.app.java.version=@java.version@

com.dipcoin.scheduler.enabled=${OSTA_SCHEDULER_ENABLED:true}
com.dipcoin.scheduler.zone-id=${OSTA_SCHEDULER_ZONE_ID:Asia/Kolkata}
com.dipcoin.scheduler.bill-reminder.cron=${OSTA_BILL_REMINDER_CRON:0 */2 * * * *}
com.dipcoin.scheduler.bill-reminder.verification-cron=${OSTA_BILL_REMINDER_VERIFICATION_CRON:0 */1 * * * *}

com.dipcoin.reconciliation.refundScheduler.reconcileCron=${OSTA_REFUND_RECONCILE_CRON:0 */5 * * * *}
com.dipcoin.reconciliation.refundScheduler.lookbackMs=${OSTA_REFUND_LOOKBACK_MS:86400000}

com.dipcoin.bbps.billReminder.zoneId=${com.dipcoin.scheduler.zone-id}
com.dipcoin.bbps.billReminder.liveCheck.enabled=${OSTA_BILL_REMINDER_LIVE_CHECK_ENABLED:false}
com.dipcoin.bbps.billReminder.liveCheck.events=${OSTA_BILL_REMINDER_LIVE_CHECK_EVENTS:DUE_IN_14_DAYS,DUE_IN_7_DAYS,DUE_IN_3_DAYS,DUE_TODAY,BILL_EXPIRED,BILL_PAY_REMINDER_AFTER_EXPIRED}
com.dipcoin.bbps.billReminder.verification.maxAgeMs=${OSTA_BILL_REMINDER_VERIFICATION_MAX_AGE_MS:14400000}
com.dipcoin.bbps.billReminder.verification.maxAttempts=${OSTA_BILL_REMINDER_VERIFICATION_MAX_ATTEMPTS:24}
com.dipcoin.bbps.billReminder.verification.batchSize=${OSTA_BILL_REMINDER_VERIFICATION_BATCH_SIZE:100}

com.dipcoin.db.services.redis.host=${OSTA_REDIS_HOST:localhost}
com.dipcoin.db.services.redis.port=${OSTA_REDIS_PORT:6379}
com.dipcoin.db.services.redis.password=${OSTA_REDIS_PASSWORD:}

